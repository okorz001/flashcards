name: Sync Labels

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/sync-labels/**
      - .github/workflows/sync-labels.yml
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/sync-labels/main.py
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
